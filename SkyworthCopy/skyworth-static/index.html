    <script>
    function mediaInit() {
        // 圆圈动画初始化
        var anmtArr = [];
        $(".ys_bandots_circle").each(function(index, item) {
            var anmt = anime({
                autoplay: false,
                targets: item,
                strokeDashoffset: [anime.setDashoffset, 0],
                easing: 'linear',
                duration: 4000,
                complete: function(anim) {
                    anim.pause();
                    anim.seek(0);
                    $('.home-numb-new-slide').slick("next");
                }
            });
            anmtArr[index] = anmt;
        });
        // $(".home-numb-new-card").css("visibility", "visible");
        // 视频播完轮播
        banVideo2(".home-numb-new-slide");
        function banVideo2(selector) {
            var $obj = $(selector);
            if ($(window).width() > 767 && $obj.find("video").length > 0) {
                init();

                function init() {
                    firstVideo();
                    videoCircleInit();
                    afterChange();
                }
                // 检验第一屏是否有视频
                function firstVideo() {
                    var $firSlide = $obj.find(".slick-slide[data-slick-index=0]");
                    var $video = $firSlide.find("video");
                    // autoplay自动播放
                    if ($video.length > 0) {
                        $obj.slick('slickPause');
                        if ($video.get(0).paused) {
                            setTimeout(function() {
                                $video.get(0).play();
                            }, 100)
                        }
                    } else {
                        anmtArr[0].play();
                    }
                }
                // 切换到下一张是否有视频
                function afterChange() {
                    $obj.on('afterChange', function(event, slick, index) {

                        var $nowSlide = $(slick.$slides[index]);
                        var $video = $nowSlide.find("video");
                        if ($video.length > 0) { // 有视频则暂停轮播
                            $video.get(0).play();
                        } else { //无则圆圈转动
                            anmtArr[index].play();
                        }

                    });
                }
                // 视频圆圈进度匹配
                function videoCircleInit() {
                    $obj.find("video").each(function() {
                        var video = $(this).get(0);
                        video.ontimeupdate = function(e) {
                            var index = parseInt($(this).parents(".slick-slide").attr("data-slick-index"));
                            var duration = this.duration;
                            var currentTime = this.currentTime;
                            var progress = parseInt((currentTime / duration) * 100) / 100;
                            if (progress < 1) {
                                if (anmtArr[index]) {
                                    anmtArr[index].seek(anmtArr[index].duration * progress);
                                }
                            } else {
                                if (anmtArr[index]) {
                                    anmtArr[index].seek(anmtArr[index].duration * 0.999999);
                                }
                                $obj.slick("next");
                            }
                        };
                    });
                };
            } else {
                anmtArr[0].play();
                $obj.on('afterChange', function(event, slick, index) {
                    anmtArr[index].play();
                })
            }

            $obj.on('beforeChange', function(event, slick, index) {
                // 视频暂停并回到第一帧
                $obj.find("video").each(function() {
                    var video = $(this).get(0);
                    video.pause();
                    video.currentTime = 0;
                });
                // 动画暂停并回到第一帧
                anmtArr[index].pause();
                anmtArr[index].seek(0);
            })
            $('.home-numb-new-slide').on('beforeChange', function (event, slick, currentSlide, nextSlide) {
                var index = nextSlide;
                $(".hnnc-ul-li").eq(index).addClass("on").siblings().removeClass("on");
            });
        };
    }
    if($(window).width() >= 768){
        $(window).scroll(function () {
            if ($('.about-intro-video-cry').hasClass('skrollable-after')) {
                if($('.add .ys-ban-video').length > 0){
                    mediaInit() 
                }
                
                if (!$('.home-numb-new-slide').hasClass('slick-initialized')) {
                    $('.home-numb-new-slide').slick({
                        dots: false,
                        speed: 1000,
                        autoplaySpeed: 3000,
                        infinite: true,
                        fade: true,
                    });
                    $('.home-numb-new-card').addClass('start')
                }
                 // dots点击切换
                $(".hnnc-ul-li").click(function() {
                    var index = $(this).index();
                    $(this).addClass("on").siblings().removeClass("on");
                    $(".home-numb-new-slide").slick("slickGoTo", index);
                });
            } else {
                if ($('.home-numb-new-slide').hasClass('slick-initialized')) {
                    try {
                        $('.home-numb-new-slide').slick('unslick');
                    } catch (e) {
                        console.error("Error while trying to unslick:", e);
                    }
                }
                $('.home-numb-new-card').removeClass('start')
            }
        });
    }else{
        $('.home-numb-new').addClass('wow ys-fadeup1')
        $('.home-numb-new-slide').slick({
            dots: true,
            speed: 1000,
            autoplaySpeed: 3000,
            infinite: true,
            fade: true,
        });
    }
    
    </script>
